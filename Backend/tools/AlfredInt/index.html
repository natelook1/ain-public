<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AfredIntel Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.263.1"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap');
        :root { color-scheme: dark; }
        body { background-color: #020617; color: #e2e8f0; font-family: 'JetBrains Mono', ui-monospace, monospace; overflow: hidden; height: 100vh; width: 100vw; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        #root { height: 100%; display: flex; flex-direction: column; }
        .tab-content { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        .hud-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(13, 17, 23, 0.6); border: 1px solid #1e293b; border-radius: 6px; }
        @media (hover: hover) { .hud-card:hover { border-color: rgba(6, 182, 212, 0.4); transform: translateY(-1px); } }
        
        /* Fixed Online Indicator Position */
        .online-indicator { 
            position: absolute; 
            top: -3px; 
            right: -3px; 
            width: 10px; 
            height: 10px; 
            background-color: #22c55e; 
            border-radius: 50%; 
            border: 2px solid #020617;
            box-shadow: 0 0 10px #22c55e; 
            animation: pulse 2s infinite; 
            z-index: 10;
        }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.6; transform: scale(0.85); } }
        
        .registry-card { background: rgba(13, 17, 23, 0.4); border: 1px solid #1e293b; border-radius: 4px; transition: all 0.2s; }
        .registry-card:hover { border-color: #3b82f6; background: rgba(13, 17, 23, 0.8); }

        /* Specific Mode Colors */
        .mode-3d { color: #10b981; } .bg-3d { background-color: #10b981; }
        .mode-2d { color: #22c55e; } .bg-2d { background-color: #22c55e; }
        .mode-flat { color: #14b8a6; } .bg-flat { background-color: #14b8a6; }
        .mode-mosaic { color: #06b6d4; } .bg-mosaic { background-color: #06b6d4; }
        .mode-standard { color: #a855f7; } .bg-standard { background-color: #a855f7; }
        .mode-compact { color: #3b82f6; } .bg-compact { background-color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
          Activity, Shield, Users, Radio, Terminal, Search, Globe, BarChart2, LayoutDashboard, Filter, XCircle,
          Target, RefreshCw, Clock, Edit2, Save, MapPin, Zap, TrendingUp, ShieldAlert, Cpu, Radar, Eye, Layers,
          Trophy, Database, PieChart, Rocket, Anchor, Map as MapIcon, X, Grid as GridIcon, List as ListIcon, AlignJustify, Maximize2, Minimize2
        } from 'lucide-react';

        const DEFAULT_ENDPOINT = "https://api-ain.looknet.ca/webhook/dashboard-intel";

        const getPilotNumber = (id) => {
          if (!id) return "0000";
          let hash = 0;
          for (let i = 0; i < id.length; i++) { hash = ((hash << 5) - hash) + id.charCodeAt(i); hash |= 0; }
          return Math.abs(hash % 10000).toString().padStart(4, '0');
        };

        const fmtDuration = (sec) => {
          if (!sec || sec < 0) return null;
          if (sec < 60) return `${sec}s`;
          if (sec < 3600) return `${Math.floor(sec / 60)}m`;
          const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
          return m > 0 ? `${h}h ${m}m` : `${h}h`;
        };

        const isMapMode = (intent, view) => {
            const v = String(view || '').toLowerCase();
            return v === 'map_3d' || v === 'map_2d' || v === 'map_flat' || v.startsWith('map_');
        };

        const cleanIntent = (intent, view, isActive = true) => {
          if (!isActive) return 'Standby';
          const v = String(view || '').toLowerCase();
          
          if (v === 'map_3d' || v.includes('tactical 3d')) return 'Tactical 3D';
          if (v === 'map_2d' || v.includes('tactical 2d')) return 'Tactical 2D';
          if (v === 'map_flat' || v.includes('flat map')) return 'Flat Map';
          
          if (v === 'mosaic' || v.includes('mosaic')) return 'Mosaic Grid';
          if (v === 'compact' || v.includes('compact')) return 'Compact Feed';
          if (v === 'standard' || v === 'list' || v.includes('standard')) return 'Standard Feed';
          
          if (intent) {
            const i = String(intent).toLowerCase();
            if (i.includes('mosaic')) return 'Mosaic Grid';
            if (i.includes('compact')) return 'Compact Feed';
            if (i.includes('map')) return 'Tactical View';
            const cleaned = String(intent).replace(/\b(Feed|List|Map|Intel)\b/gi, '').replace(/\s+/g, ' ').trim();
            if (cleaned) return cleaned;
          }
          return 'Passive Uplink';
        };

        const getBadgeStyle = (key) => {
            const k = String(key).toLowerCase();
            if (k.includes('alliance')) return "bg-cyan-950/40 border-cyan-800 text-cyan-400";
            if (k.includes('corporation') || k.includes('corp')) return "bg-blue-950/40 border-blue-800 text-blue-400";
            if (k.includes('ship')) return "bg-amber-950/40 border-amber-800 text-amber-400";
            if (k.includes('region')) return "bg-emerald-950/40 border-emerald-800 text-emerald-400";
            if (k.includes('system') || k.includes('target')) return "bg-indigo-950/40 border-indigo-800 text-indigo-400";
            if (k.includes('space')) return "bg-orange-950/40 border-orange-800 text-orange-400";
            return "bg-slate-800 border-slate-700 text-slate-400";
        };

        const getModeStyle = (view) => {
            const v = String(view || '').toLowerCase();
            if (v === 'map_3d')   return { color: 'text-emerald-400', border: 'border-emerald-800/60', bg: 'bg-emerald-950/30', label: 'TACTICAL 3D' };
            if (v === 'map_2d')   return { color: 'text-green-400',   border: 'border-green-800/60',   bg: 'bg-green-950/30',   label: 'TACTICAL 2D' };
            if (v === 'map_flat') return { color: 'text-teal-400',    border: 'border-teal-800/60',    bg: 'bg-teal-950/30',    label: 'FLAT MAP' };
            if (v === 'mosaic')   return { color: 'text-cyan-400',    border: 'border-cyan-800/60',    bg: 'bg-cyan-950/30',    label: 'MOSAIC GRID' };
            if (v === 'compact')  return { color: 'text-blue-400',    border: 'border-blue-800/60',    bg: 'bg-blue-950/30',    label: 'COMPACT FEED' };
            return                        { color: 'text-purple-400', border: 'border-purple-800/60',  bg: 'bg-purple-950/30',  label: 'STANDARD FEED' };
        };

        const getRowStyle = (intent, view) => {
            const i = String(intent || '').toLowerCase();
            const v = String(view || '').toLowerCase();
            let color = "slate";
            if (v.includes('map') || i.includes('map') || i.includes('tactical')) color = "emerald";
            else if (v === 'mosaic' || v === 'compact' || i.includes('feed')) color = "purple";
            else if (i.includes('hunter') || i.includes('profiler')) color = "red";
            return `border-l-2 border-l-${color}-500 bg-${color}-950/10 hover:bg-${color}-900/15 transition-all`;
        };

        const App = () => {
          const [data, setData] = useState(null);
          const [error, setError] = useState(null);
          const [isPaused, setIsPaused] = useState(false);
          const [activeTab, setActiveTab] = useState('live');
          const [selectedUser, setSelectedUser] = useState(null);
          const [displayLimit, setDisplayLimit] = useState(150);
          const [viewFilterMode, setViewFilterMode] = useState('all');
          const [hoveredBar, setHoveredBar] = useState(null);

          const [nicknames, setNicknames] = useState(() => {
            try { return JSON.parse(localStorage.getItem('intel_nicknames')) || {}; } catch (e) { return {}; }
          });
          const [editingNickname, setEditingNickname] = useState(null);
          const [editValue, setEditValue] = useState('');
          const nicknameInputRef = useRef(null);
          const [expandedRegistry, setExpandedRegistry] = useState(false);

          const fetchData = async () => {
            try {
              const response = await fetch(DEFAULT_ENDPOINT);
              if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
              const result = await response.json();
              setData(Array.isArray(result) ? result[0] : result);
              setError(null);
            } catch (err) { setError(err.message); }
          };

          useEffect(() => {
            fetchData();
            const interval = setInterval(() => { if (!isPaused) fetchData(); }, 5000);
            return () => clearInterval(interval);
          }, [isPaused]);

          const renderFilters = (queryData, resolvedData = {}, size = 'md') => {
            if (!queryData || Object.keys(queryData).length === 0) return null;
            const badges = [];
            
            const keyMappings = {
                'alliance_id': 'alliance_name',
                'corporation_id': 'corporation_name',
                'character_id': 'character_name',
                'ship_type_id': 'ship_type_name',
                'region_id': 'region_name',
                'solar_system_id': 'system_name',
                'system_id': 'system_name'
            };

            Object.keys(queryData).forEach((key) => {
              const val = queryData[key];
              const cleanKey = key.replace('filters_', '').replace('_id', '').toLowerCase();
              if (!val || ['limit', 'before_kill', 'latest_known', 'view', 'fingerprint', 'ip', 'ip_address', 'sse_client', 'sse'].includes(cleanKey)) return;

              const searchKey = key.replace('filters_', '');
              const idNames = data?.id_names || {};
              const isMulti = String(val).includes(',');
              const idList = isMulti ? String(val).split(',').filter(Boolean) : [String(val)];
              const resolvedName = idNames[String(idList[0]?.trim())] || resolvedData?.[keyMappings[searchKey]] || resolvedData?.[searchKey.replace('_id', '_name')] || resolvedData?.[cleanKey + '_name'] || queryData?.[cleanKey + '_name'] || val;

              if (['alliance', 'corp', 'char', 'ship', 'region', 'system'].some(t => cleanKey.includes(t))) {
                  const images = idList.slice(0, 5).map((id, i) => {
                      let src = ''; if (!String(id.trim()).match(/^\d+$/)) return null;
                      const tid = id.trim();
                      if (cleanKey.includes('alliance')) src = `https://images.evetech.net/alliances/${tid}/logo?size=64`;
                      else if (cleanKey.includes('corp')) src = `https://images.evetech.net/corporations/${tid}/logo?size=64`;
                      else if (cleanKey.includes('char')) src = `https://images.evetech.net/characters/${tid}/portrait?size=64`;
                      else if (cleanKey.includes('ship') || cleanKey.includes('type')) src = `https://images.evetech.net/types/${tid}/icon?size=64`;
                      return src ? <img key={`${key}-${tid}`} src={src} className="w-3.5 h-3.5 rounded-sm border border-slate-800 bg-slate-950 shrink-0 shadow-sm" /> : null;
                  }).filter(Boolean);

                  if (images.length > 0) {
                      const multiNames = idList.slice(0, 3).map(id => idNames[id.trim()] || null).filter(Boolean);
                      badges.push(
                        <div key={key} className={`flex items-center gap-1.5 px-2 py-0.5 border border-slate-800 bg-slate-900/60 rounded font-mono text-[9px] ${getBadgeStyle(cleanKey)}`}>
                            <span className="opacity-50 font-bold uppercase">{cleanKey}:</span>
                            <div className="flex -space-x-1.5">{images}</div>
                            {!isMulti && <span className="font-black ml-1 truncate max-w-[120px]">{String(resolvedName)}</span>}
                            {isMulti && multiNames.length > 0 && <span className="font-black ml-1 truncate max-w-[150px]">{multiNames.join(', ')}{idList.length > multiNames.length ? ` +${idList.length - multiNames.length}` : ''}</span>}
                            {isMulti && multiNames.length === 0 && <span className="text-[8px] opacity-60 ml-0.5">({idList.length})</span>}
                        </div>
                      );
                      return;
                  }
              }
              badges.push(<div key={key} className={`flex items-center gap-1.5 px-2 py-0.5 border border-slate-800 bg-slate-900/60 rounded font-mono text-[9px] ${getBadgeStyle(cleanKey)}`}><span className="opacity-50 font-bold uppercase">{cleanKey}:</span><span className="font-black truncate max-w-[150px]">{String(resolvedName)}</span></div>);
            });
            return <div className={`flex flex-wrap gap-1 ${size === 'md' ? 'justify-end' : ''}`}>{badges}</div>;
          };

          const [intelEntityTab, setIntelEntityTab] = useState('alliance');

          const processedUsers = useMemo(() => {
            if (!data?.top_users) return [];

            return data.top_users.map(user => {
              // Now completely trusts the backend single-source-of-truth boolean
              const calculatedActive = user.active_now || false;

              const rawViews = user.active_views?.length ? user.active_views : [user.last_view || 'standard'];
              const hasSpecific = rawViews.some(v => v !== 'standard');
              const activeViews = hasSpecific ? rawViews.filter(v => v !== 'standard') : rawViews;

              return {
                ...user,
                calculatedActive,
                activeViews,
                latestFilters: user.latest_filters || {},
                latestResolved: user.latest_resolved || {},
              };
            }).sort((a, b) => (b.calculatedActive ? 1 : 0) - (a.calculatedActive ? 1 : 0) || b.hits - a.hits);
          }, [data]);

          const liveDistribution = useMemo(() => {
            const activeUsers = processedUsers.filter(u => u.calculatedActive);
            let m3d = 0, m2d = 0, mf = 0, mo = 0, s = 0, c = 0;
            let totalSessions = 0;

            activeUsers.forEach(u => {
                u.activeViews.forEach(raw => {
                    const v = String(raw || 'standard').toLowerCase();
                    totalSessions++;
                    if (v === 'mosaic') mo++;
                    else if (v === 'compact') c++;
                    else if (v === 'map_3d') m3d++;
                    else if (v === 'map_flat') mf++;
                    else if (v === 'map_2d' || v.includes('map')) m2d++;
                    else s++;
                });
            });
            const ts = totalSessions || 1;
            return { m3d, m2d, mf, mo, s, c, m3dP: Math.round((m3d/ts)*100), m2dP: Math.round((m2d/ts)*100), mfP: Math.round((mf/ts)*100), moP: Math.round((mo/ts)*100), sP: Math.round((s/ts)*100), cP: Math.round((c/ts)*100) };
          }, [processedUsers]);

          const intelAnalytics = useMemo(() => {
            if (!data) return null;
            const idNames = data.id_names || {};
            
            const entityCounts = {};
            const countFilters = (filters) => {
                if (!filters) return;
                Object.entries(filters).forEach(([key, val]) => {
                    if (!val) return;
                    const k = key.replace('filters_', '').toLowerCase();
                    let type = null;
                    if (k.includes('alliance')) type = 'alliance';
                    else if (k.includes('corp')) type = 'corporation';
                    else if (k.includes('region')) type = 'region';
                    else if (k.includes('system') || k.includes('solar')) type = 'system';
                    else if (k.includes('char')) type = 'character';
                    if (!type) return;
                    if (!entityCounts[type]) entityCounts[type] = {};
                    String(val).split(',').forEach(id => {
                        id = id.trim();
                        if (!id || !id.match(/^\d+$/)) return;
                        entityCounts[type][id] = (entityCounts[type][id] || 0) + 1;
                    });
                });
            };
            processedUsers.forEach(u => countFilters(u.latestFilters));

            const topEntities = {};
            ['alliance', 'corporation', 'region', 'system', 'character'].forEach(type => {
                const counts = entityCounts[type] || {};
                topEntities[type] = Object.entries(counts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 8)
                    .map(([id, count]) => ({ id, count, name: idNames[id] || null }));
            });

            const geoCounts = {};
            processedUsers.forEach(u => {
                if (u.geo?.country) {
                    const key = u.geo.country;
                    if (!geoCounts[key]) geoCounts[key] = { count: 0, active: 0, code: u.geo.code };
                    geoCounts[key].count++;
                    if (u.calculatedActive) geoCounts[key].active++;
                }
            });
            const geoList = Object.entries(geoCounts)
                .sort((a, b) => b[1].count - a[1].count)
                .slice(0, 14)
                .map(([country, d]) => ({ country, count: d.count, active: d.active, code: d.code }));

            const timeline = data.timeline || [];
            const timelineMax = Math.max(...timeline.map(t => t.count), 1);

            const totalEntitiesWatched = Object.values(entityCounts).reduce((a, map) => a + Object.keys(map).length, 0);
            return { topEntities, geoList, timeline, timelineMax, totalEntitiesWatched };
          }, [data, processedUsers]);

          const usageStats = data?.overview?.usage_stats || {};
          const histTotal = Object.values(usageStats).reduce((a, b) => a + b, 0) || 1;

          const filteredLogs = useMemo(() => {
             return (data?.recent_logs || []).filter(l => {
                if (selectedUser && l.Fingerprint !== selectedUser) return false;
                if (viewFilterMode === 'map') return isMapMode(l.Intent, l.View);
                if (viewFilterMode === 'feed') return !isMapMode(l.Intent, l.View);
                return true;
             }).slice(0, displayLimit);
          }, [data, viewFilterMode, displayLimit, selectedUser]);

          const saveNickname = (pilotId, value) => {
            const trimmed = value.trim();
            const updated = { ...nicknames };
            if (trimmed) { updated[pilotId] = trimmed; } else { delete updated[pilotId]; }
            setNicknames(updated);
            localStorage.setItem('intel_nicknames', JSON.stringify(updated));
            setEditingNickname(null);
          };

          const startEdit = (e, userId, currentNick) => {
            e.stopPropagation();
            setEditingNickname(userId);
            setEditValue(currentNick || '');
            setTimeout(() => nicknameInputRef.current?.focus(), 50);
          };

          return (
            <div className="flex flex-col h-screen bg-[#020617] text-[#c9d1d9] selection:bg-cyan-500/30 overflow-hidden font-mono uppercase text-left">
              {!data && !error && (<div className="fixed inset-0 bg-[#020617] z-50 flex flex-col items-center justify-center p-4 animate-pulse uppercase tracking-[0.2em] font-black"><Terminal className="w-10 h-10 text-cyan-500 mb-4" /> Uplink Pending...</div>)}

              {expandedRegistry && (
                <div className="fixed inset-0 z-50 bg-[#020617]/96 backdrop-blur-sm flex flex-col p-6" onClick={() => setExpandedRegistry(false)}>
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-[#1e293b] shrink-0" onClick={e => e.stopPropagation()}>
                    <div className="flex items-center gap-3">
                      <Users className="w-4 h-4 text-cyan-500" />
                      <h2 className="text-[12px] font-black tracking-widest text-slate-100 uppercase">Pilot Registry</h2>
                      <span className="text-[10px] font-black text-emerald-400 tracking-wide">{processedUsers.filter(u=>u.calculatedActive).length} ONLINE · {processedUsers.length} TOTAL</span>
                    </div>
                    <button onClick={() => setExpandedRegistry(false)} className="p-1.5 text-slate-500 hover:text-white transition-colors border border-slate-800 hover:border-slate-600 rounded"><X className="w-4 h-4" /></button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 overflow-y-auto custom-scrollbar flex-1" onClick={e => e.stopPropagation()}>
                    {processedUsers.map((user, idx) => {
                      const isActive = user.calculatedActive;
                      const nickname = nicknames[user.id] || user.nickname;
                      return (
                        <div key={user.id} onClick={() => { setSelectedUser(selectedUser === user.id ? null : user.id); setExpandedRegistry(false); }}
                          className={`registry-card p-3 cursor-pointer flex flex-col gap-2 ${selectedUser === user.id ? 'border-amber-500/50 bg-amber-950/10' : ''} ${!isActive && 'opacity-30'}`}>
                          <div className="flex justify-between items-start gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                              <div className={`relative w-8 h-8 rounded-sm border ${isActive ? 'border-[#22c55e] text-[#22c55e]' : 'border-slate-800 text-slate-600'} flex items-center justify-center font-black text-[11px] bg-slate-950 shrink-0`}>
                                {idx+1}{isActive && <div className="online-indicator"></div>}
                              </div>
                              <div className="min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap mb-0.5">
                                  {user.geo?.code && <img src={`https://flagcdn.com/16x12/${user.geo.code.toLowerCase()}.png`} className="w-3.5 h-2.5 rounded-sm shrink-0 border border-slate-800" alt={user.geo.code} />}
                                  {editingNickname === user.id ? (
                                    <input ref={nicknameInputRef} className="bg-slate-900 border border-cyan-700 rounded px-1.5 text-cyan-400 text-[11px] font-black w-32 outline-none" value={editValue} onChange={e => setEditValue(e.target.value)} onKeyDown={e => { if(e.key==='Enter') saveNickname(user.id, editValue); if(e.key==='Escape') setEditingNickname(null); }} onBlur={() => saveNickname(user.id, editValue)} onClick={e => e.stopPropagation()} placeholder={`PILOT#${getPilotNumber(user.id)}`} maxLength={20} />
                                  ) : (<>
                                    <span className={`text-[12px] font-black tracking-wide truncate ${nickname ? 'text-cyan-400' : 'text-slate-100'}`}>{nickname || `PILOT#${getPilotNumber(user.id)}`}</span>
                                    <button onClick={e => startEdit(e, user.id, nickname)} className="text-slate-700 hover:text-cyan-500 transition-colors shrink-0" title="Edit callsign"><Edit2 className="w-2.5 h-2.5" /></button>
                                  </>)}
                                </div>
                                <div className="flex items-center gap-1 flex-wrap">
                                  {user.activeViews.map(view => { const ms = getModeStyle(view); return <span key={view} className={`text-[8px] px-1 py-0.5 rounded font-black shrink-0 border ${ms.border} ${ms.bg} ${ms.color}`}>{ms.label}</span>; })}
                                  <span className={`text-[7px] px-1 py-0.5 rounded font-black shrink-0 border ${user.connection_type === 'sse' ? 'border-cyan-700 bg-cyan-950/40 text-cyan-400' : 'border-amber-800 bg-amber-950/30 text-amber-500'}`}>{user.connection_type === 'sse' ? 'PUSH' : 'POLL'}</span>
                                  {user.connection_type === 'sse' && fmtDuration(user.session_duration_sec) && <span className="text-[7px] text-slate-500 font-black">{fmtDuration(user.session_duration_sec)}</span>}
                                  {user.session_count > 1 && <span className="text-[7px] px-1 py-0.5 rounded font-black shrink-0 border border-slate-700 bg-slate-900/60 text-slate-400">{user.session_count} TAB{user.session_count > 1 ? 'S' : ''}</span>}
                                  {user.geo?.country && <span className="text-[8px] text-slate-500 font-black">{user.geo.country}</span>}
                                </div>
                              </div>
                            </div>
                            <div className="text-right shrink-0">

                        <div className="p-4 border-b border-[#1e293b] bg-[#020617]/40 flex justify-between items-center z-20 shrink-0">
                          <div className="flex items-center gap-6">
                            <div className="flex items-center gap-2.5"><Terminal className="w-4 h-4 text-cyan-500 animate-pulse" /><h3 className="text-[10px] font-black tracking-[0.2em] text-slate-200 uppercase">SIGNAL MATRIX</h3></div>
                            <div className="flex p-0.5 bg-slate-900 border border-[#1e293b] rounded">
                                {['ALL', 'FEED', 'MAP'].map(m => (
                                    <button key={m} onClick={() => setViewFilterMode(m.toLowerCase())} className={`px-4 py-1 text-[9px] font-black rounded transition-all ${viewFilterMode === m.toLowerCase() ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}>{m}</button>
                                ))}
                            </div>
                            {selectedUser && (() => {
                                const su = processedUsers.find(u => u.id === selectedUser);
                                const nick = nicknames[selectedUser] || su?.nickname;
                                const label = nick || `PILOT#${getPilotNumber(selectedUser)}`;
                                return (
                                    <div className="flex items-center gap-1.5 px-2 py-1 bg-amber-950/30 border border-amber-800/60 rounded text-[9px] font-black text-amber-400">
                                        <span className="text-amber-600 tracking-widest">PILOT:</span>
                                        <span>{label}</span>
                                        <button onClick={() => setSelectedUser(null)} className="ml-1 text-amber-600 hover:text-amber-300 transition-colors leading-none" title="Clear pilot filter">
                                            <X className="w-3 h-3" />
                                        </button>
                                    </div>
                                );
                            })()}
                          </div>
                          <div className="text-[9px] font-black text-slate-400 tracking-wide">
                            {filteredLogs.length} {selectedUser ? 'SIGNALS' : 'OF ' + (data?.recent_logs?.length || 0)}
                          </div>
                        </div>
                        <div className="flex-1 overflow-auto custom-scrollbar">
                          <table className="w-full text-left border-separate border-spacing-0 min-w-[600px]">
                            <thead className="bg-[#020617] sticky top-0 z-30 text-slate-400 text-[10px] font-black tracking-wider shadow-md uppercase">
                              <tr><th className="p-4 border-b border-[#1e293b]">TIME</th><th className="p-4 border-b border-[#1e293b]">VIEW STATE</th><th className="p-4 border-b border-[#1e293b]">CONN</th><th className="p-4 border-b border-[#1e293b]">IDENTITY</th><th className="p-4 border-b border-[#1e293b] text-right pr-8">VECTOR DETAILS</th></tr>
                            </thead>
                            <tbody className="divide-y divide-[#1e293b]/30">
                              {filteredLogs.map((log, idx) => {
                                const ms = getModeStyle(log.View);
                                return (
                                <tr key={idx} className={`transition-all duration-300 ${getRowStyle(log.Intent, log.View)}`}>
                                  <td className="p-4 text-slate-400 text-[10px] font-black align-top">{log.Time.split(' ')[1]}</td>
                                  <td className="p-4 align-top">
                                      <span className={`px-2 py-0.5 rounded text-[9px] font-black border ${ms.border} ${ms.bg} ${ms.color}`}>
                                          {ms.label}
                                      </span>
                                  </td>
                                  <td className="p-4 align-top">
                                      <span className={`px-1.5 py-0.5 rounded text-[8px] font-black border ${log.Sse ? 'border-cyan-700 bg-cyan-950/40 text-cyan-400' : 'border-amber-800 bg-amber-950/30 text-amber-500'}`}>
                                          {log.Sse ? 'PUSH' : 'POLL'}
                                      </span>
                                  </td>
                                  <td className="p-4 font-black text-slate-300 text-[11px] align-top tracking-wide">
                                      <div className="flex items-center gap-1.5">
                                          {log.Geo?.code && <img src={`https://flagcdn.com/16x12/${log.Geo.code.toLowerCase()}.png`} className="w-3.5 h-2.5 rounded-sm border border-slate-900 shrink-0" alt={log.Geo.code} />}
                                          {nicknames[log.Fingerprint] || `PILOT#${getPilotNumber(log.Fingerprint)}`}
                                      </div>
                                  </td>
                                  <td className="p-4 align-top text-right pr-8">{renderFilters(log.Filters, log.Resolved)}</td>
                                </tr>
                                );})}
                            </tbody>
                          </table>
                        </div>
                      </section>
                    </div>
                  )
                )}
              </main>
            </div>
          );
        };
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
